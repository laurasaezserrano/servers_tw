spring.application.name=ecoembes-Server
server.port=9000

#Configuración H2 y JPA
spring.datasource.url=jdbc:h2:file:./data/ecoembesdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Propiedades para los Gateways externos (Evita hardcoding)
plant.plassb.base-url=http://localhost:8081/plassb
plant.contsocket.host=localhost
plant.contsocket.port=9090

